<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  @font-face { font-family: "Fraunces"; src: url("../deck/fonts/fraunces.woff2") format("woff2-variations"); font-weight: 300 900; }
  @font-face { font-family: "JetBrains Mono"; src: url("../deck/fonts/jono.woff2") format("woff2-variations"); font-weight: 100 800; }
  body { width: 1280px; height: 720px; background: #f6f1e7; color: #1d1a15; font-family: "Fraunces", serif;
         background-image: radial-gradient(rgba(29,26,21,.045) 1px, transparent 1px); background-size: 22px 22px;
         display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 0 90px; }
  .mono { font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: #4d4638; }
  h1 { font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1; font-size: 88px; letter-spacing: -0.02em; line-height: 1; margin: 22px 0 26px; }
  hr { border: none; border-top: 3px double #d8cfbc; width: 100%; margin-bottom: 26px; }
</style>
</head>
<body>
  <span class="mono">Doorknock · pre-meeting briefing agent</span>
  <h1>Agents propose.<br/>Code disposes.</h1>
  <hr/>
  <span class="mono">github.com/sneldao/doorknock &nbsp;·&nbsp; 30-day research via Tavily &nbsp;·&nbsp; models via Bifrost</span>
</body>
</html>
