<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;background:#08090c}
  #kt-root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#08090c;
    font-family:"JetBrains Mono","SF Mono",Menlo,monospace;display:flex;align-items:center;justify-content:center}
  #kt-cam{will-change:transform}
  #kt-win{width:1560px;background:#0e1218;border:1px solid #1f2733;border-radius:16px;
    box-shadow:0 60px 160px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.03) inset;overflow:hidden}
  #kt-bar{display:flex;gap:10px;align-items:center;padding:16px 20px;background:#131a24;border-bottom:1px solid #1f2733}
  #kt-bar i{width:13px;height:13px;border-radius:50%;display:block}
  #kt-bar .r{background:#f87171}#kt-bar .y{background:#fbbf24}#kt-bar .g{background:#4ade80}
  #kt-title{margin-left:16px;color:#5b6b80;font-size:19px;letter-spacing:.05em}
  #kt-run{margin-left:auto;color:#39455a;font-size:17px}
  #kt-body{padding:40px 46px 48px;min-height:560px;position:relative}
  .kt-line{white-space:pre-wrap;word-break:break-word;font-size:25px;line-height:1.72;color:#9fb0c3;opacity:0}
  .kt-line.cmd{color:#e8ecf3}
  .kt-line.dim{color:#5f7186}
  .kt-line.pass{color:#4ade80}
  .kt-line.fail{color:#f87171}
  .kt-line.big{font-size:30px;font-weight:600;letter-spacing:.02em}
  .kt-line .tag{display:inline-block;min-width:118px;color:#7d8aa0}
  .kt-line.pass .tag{color:#2f9e6e}
  .kt-line.fail .tag{color:#b8453f}
  .kt-line.hl{border-radius:8px;padding:2px 14px;margin:0 -14px;background:rgba(248,113,113,.08);box-shadow:0 0 0 1px rgba(248,113,113,.25)}
  .kt-line.hlg{border-radius:8px;padding:2px 14px;margin:0 -14px;background:rgba(74,222,128,.07);box-shadow:0 0 0 1px rgba(74,222,128,.25)}
  #kt-progress{opacity:0;margin:6px 0 6px 132px;display:flex;align-items:center;gap:16px;font-size:22px;color:#5f7186}
  #kt-progress .track{width:640px;height:14px;background:#1a2230;border-radius:7px;overflow:hidden}
  #kt-progress .fill{height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#4ade80);border-radius:7px}
  #kt-progress2{opacity:0;margin:6px 0 6px 132px;display:flex;align-items:center;gap:16px;font-size:22px;color:#5f7186}
  #kt-progress2 .track{width:640px;height:14px;background:#1a2230;border-radius:7px;overflow:hidden}
  #kt-progress2 .fill{height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#4ade80);border-radius:7px}
  .caret{display:inline-block;width:13px;height:28px;background:#4ade80;vertical-align:-5px;margin-left:3px}
  #kt-scan{position:absolute;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
  #kt-vig{position:absolute;inset:0;pointer-events:none;z-index:6;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(4,5,7,.55) 100%)}
</style>
</head>
<body>
<div id="kt-root" data-composition-id="kane-terminal" data-start="0" data-duration="21" data-width="1920" data-height="1080">
  <div id="kt-scan"></div><div id="kt-vig"></div>
  <div id="kt-cam">
  <div id="kt-win">
    <div id="kt-bar"><i class="r"></i><i class="y"></i><i class="g"></i>
      <span id="kt-title">kane-cli run — agent — headless</span>
      <span id="kt-run">hydra-loop.sse · recorded</span>
    </div>
    <div id="kt-body"></div>
  </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script>
(function(){
  var DUR=21;
  // Curated from docs/kane/hydra-loop.sse — verbatim lines, trimmed set.
  var ROWS=[
    {k:'cmd', t:'$ kane-cli run --agent --headless /?run=run-mwl9uv2c-p7ht4c'},
    {k:'dim', tag:'KANE',   t:'watching — real-browser audit of the rendered brief'},
    {k:'bar', id:'kt-progress', t:'assertions'},
    {k:'dim', tag:'KANE',   t:'step 5 failed: EVERY development exposes ≥1 source link'},
    {k:'fail big hl', tag:'KANE',   t:'attempt 1 — FAILED · policy fail — development cards have no source links'},
    {k:'dim', tag:'FIXER',  t:'repairing — rewriting the brief against the sealed transcript (1/1)'},
    {k:'pass', tag:'AUDITOR',t:'PASS — 3/3 developments source-traced (grounding 100%)'},
    {k:'dim', tag:'KANE',   t:'watching — second audit of the repaired /?run='},
    {k:'bar', id:'kt-progress2', t:'assertions'},
    {k:'pass big hlg', tag:'KANE', t:'attempt 2 — PASSED · policy pass'},
    {k:'dim', tag:'DESK',   t:'verification closed — 1 repair used'},
    {k:'cmd', t:'$ exit 0'}
  ];
  var body=document.getElementById('kt-body');
  var els=[];
  ROWS.forEach(function(r){
    if(r.k==='bar'){
      var p=document.createElement('div');p.id=r.id;
      p.innerHTML='<span class="track"><span class="fill"></span></span><span class="lbl">0 / 6 '+r.t+'</span>';
      body.appendChild(p); els.push(p); return;
    }
    var d=document.createElement('div');d.className='kt-line '+r.k;
    d.innerHTML=(r.tag?'<span class="tag">'+r.tag+'</span>':'')+r.t;
    body.appendChild(d); els.push(d);
  });
  var caret=document.createElement('span');caret.className='caret';caret.style.opacity=0;
  body.appendChild(caret);

  // timeline
  var CMD=ROWS[0].t;
  var typed={i:0};
  els[0].textContent='';
  gsap.to(els[0],{opacity:1,duration:.01,delay:.2});
  gsap.to(caret,{opacity:1,duration:.01,delay:.2});
  gsap.to(typed,{i:CMD.length,duration:2.4,ease:'none',delay:.3,
    onUpdate:function(){els[0].textContent=CMD.slice(0,Math.round(typed.i)); caret.style.opacity=1;
      if(els[0].lastChild!==caret) els[0].appendChild(caret);}});
  // caret blink via opacity tween loop (deterministic)
  gsap.to(caret,{opacity:0,duration:.5,repeat:40,yoyo:true,ease:'steps(1)',delay:2.9});

  var t=3.1;
  function show(el,cls,extra){
    gsap.to(el,{opacity:1,y:0,duration:.28,ease:'power2.out',delay:t});
    if(extra) extra(el);
  }
  // KANE watching
  show(els[1]);
  // progress 1: 0→5/6 over 2.8s
  t+=.4;
  gsap.to(els[2],{opacity:1,duration:.2,delay:t});
  var p={v:0},lbl=els[2].querySelector('.lbl'),fill=els[2].querySelector('.fill');
  gsap.to(p,{v:5,duration:2.6,ease:'power1.inOut',delay:t+.1,onUpdate:function(){
    var n=Math.round(p.v); fill.style.width=(n/6*100)+'%'; lbl.textContent=n+' / 6 assertions';}});
  t+=3.0;
  // step failed
  show(els[3]);
  t+=.55;
  // FAILED big
  show(els[4],null,function(el){gsap.fromTo(el,{scale:.97},{scale:1,duration:.35,ease:'power3.out',delay:t});});
  t+=1.5;
  // fixer + auditor burst
  show(els[5]); t+=1.0; show(els[6]);
  t+=1.3;
  // second audit + progress 0→6
  show(els[7]); t+=.35;
  gsap.to(els[8],{opacity:1,duration:.2,delay:t});
  var p2={v:0},lbl2=els[8].querySelector('.lbl'),fill2=els[8].querySelector('.fill');
  gsap.to(p2,{v:6,duration:2.2,ease:'power1.inOut',delay:t+.1,onUpdate:function(){
    var n=Math.round(p2.v); fill2.style.width=(n/6*100)+'%'; lbl2.textContent=n+' / 6 assertions · 0 failed';}});
  t+=2.6;
  // PASSED big
  show(els[9],null,function(el){gsap.fromTo(el,{scale:.97},{scale:1,duration:.35,ease:'power3.out',delay:t});});
  t+=1.1;
  show(els[10]); t+=.8;
  show(els[11]);
  gsap.to(els[11],{x:0,duration:.01,delay:t});
  // caret moves to exit line, blinks till end
  gsap.delayedCall(t+.1,function(){els[11].appendChild(caret);});
  // 2% camera push
  gsap.to('#kt-cam',{scale:1.02,duration:DUR,ease:'none'});
})();
</script>
</body>
</html>
